name = "god-emperornovel"
main = "src/index.js"
compatibility_date = "2026-09-08"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/api/*", "/novel/*", "/read/*", "/fandom/*", "/author/*", "/catalog", "/formats", "/format/*", "/genres", "/tags", "/search", "/library", "/history", "/following", "/tickets", "/requests", "/omniportal", "/community", "/leaderboard", "/tier-list", "/random", "/made-for-you", "/settings", "/for-you", "/trending", "/vote", "/notifications", "/account", "/login", "/register", "/admin", "/author", "/trend-factory", "/community-taxonomy", "/privacy", "/terms", "/copyright"]

[[d1_databases]]
binding = "DB"
database_name = "god-emperornovel-db"
database_id = "78493557-1142-45e6-96aa-2ba9f67e3be0"
migrations_dir = "migrations"

[vars]
SITE_NAME = "Imperial Novel"
APP_VERSION = "17.20.0"
APP_ICON_PATH = "/imperial-novel-app-icon.svg"
OPENAI_MODEL = "gpt-5-mini"
OPENAI_BASE_URL = "https://api.openai.com/v1/responses"
CONNECTOR_HOST_ALLOWLIST = ""
PAYMENT_WEBHOOK_SECRET = ""

[triggers]
crons = ["*/15 * * * *", "0 * * * *", "0 3 * * *"]
