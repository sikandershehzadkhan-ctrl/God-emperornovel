<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Password recovery | Imperial Novel</title>
<style>
:root{color-scheme:dark;--bg:#080812;--panel:#111124;--line:#29294a;--ink:#f7f6ff;--muted:#a9a8c4;--purple:#a78bfa;--blue:#60a5fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#24204a 0,transparent 55%),var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,460px);padding:34px 28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.045),transparent 55%),var(--panel);box-shadow:0 24px 80px #0008}
.crest{width:54px;height:54px;margin:0 auto 20px;border:1px solid #6253a3;border-radius:18px;display:grid;place-items:center;color:var(--purple);font-size:25px;background:#17152d}
h1{text-align:center;font-size:25px;line-height:1.2;margin:0 0 10px;letter-spacing:-.035em}p{color:var(--muted);text-align:center;margin:0 0 22px}
label{display:block;font-size:13px;color:#c9c7df;margin:15px 0 7px}input{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);background:#090916;color:var(--ink);font:inherit;outline:none}input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #a78bfa22}
button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:11px;background:linear-gradient(100deg,#7c3aed,#2563eb);color:white;font:600 15px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.status{min-height:48px;margin-top:16px;padding:12px;border-radius:11px;background:#090916;border:1px solid var(--line);color:var(--muted);font-size:14px}.status[data-state=success]{color:#a7f3d0;border-color:#23634c}.status[data-state=error]{color:#fecaca;border-color:#713b48}a{display:block;text-align:center;margin-top:20px;color:#c4b5fd;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<div class="crest" aria-hidden="true">✦</div>
<h1 id="heading">Password recovery</h1>
<p id="intro">Enter your account email. If an account matches, recovery instructions will be sent.</p>
<form id="request-form">
<label for="email">Email address</label>
<input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
<button id="request-button" type="submit">Send recovery link</button>
</form>
<form id="reset-form" hidden>
<label for="password">New password</label>
<input id="password" name="password" type="password" minlength="8" maxlength="1024" autocomplete="new-password" required>
<label for="confirm">Confirm new password</label>
<input id="confirm" name="confirm" type="password" minlength="8" maxlength="1024" autocomplete="new-password" required>
<button id="reset-button" type="submit">Change password</button>
</form>
<div id="status" class="status" role="status" aria-live="polite" hidden></div>
<a href="/">Return to Imperial Novel</a>
</main>
<script>
(()=>{
 const $=id=>document.getElementById(id),status=$("status");
 const show=(message,state)=>{status.hidden=false;status.textContent=message;status.dataset.state=state};
 const requestForm=$("request-form"),resetForm=$("reset-form");
 let token="";
 try{token=new URLSearchParams(location.hash.slice(1)).get("token")||""}catch{}
 history.replaceState(null,"",location.pathname+location.search);
 if(/^[A-Za-z0-9_-]{43}$/.test(token)){
  requestForm.hidden=true;resetForm.hidden=false;
  $("heading").textContent="Choose a new password";
  $("intro").textContent="Create a new password for your Imperial Novel account.";
 }else{
  token="";
 }
 requestForm.addEventListener("submit",async event=>{
  event.preventDefault();const button=$("request-button");button.disabled=true;
  try{
   const response=await fetch("/api/auth/password-reset/request",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:$("email").value}),credentials:"same-origin",cache:"no-store"});
   if(response.ok)show("If an account matches that address, recovery instructions will be sent.","success");
   else show("The request could not be completed. Please try again later.","error");
  }catch{show("The request could not be completed. Please try again later.","error")}
  finally{button.disabled=false}
 });
 resetForm.addEventListener("submit",async event=>{
  event.preventDefault();
  const password=$("password").value,confirm=$("confirm").value;
  if(password!==confirm){show("The passwords do not match.","error");return}
  if(password.length<8||password.length>1024){show("Choose a password between 8 and 1024 characters.","error");return}
  const button=$("reset-button");button.disabled=true;
  try{
   const response=await fetch("/api/auth/password-reset/complete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,password}),credentials:"same-origin",cache:"no-store"});
   const result=await response.json().catch(()=>({}));
   if(response.ok&&result.ok===true){
    token="";$("password").value="";$("confirm").value="";resetForm.hidden=true;
    $("heading").textContent="Password updated";$("intro").textContent="Your password has been changed. Sign in with your new password.";
    show("Password changed successfully. All existing sessions have been signed out.","success");
   }else show(result.error||"This recovery link is invalid or has expired.","error");
  }catch{show("Password recovery is temporarily unavailable. Please try again later.","error")}
  finally{button.disabled=false}
 });
})();
</script>
</body>
</html>
