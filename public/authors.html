<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="description" content="Meet creators behind published, rights-cleared stories in the Imperial Novel catalog.">
<meta name="robots" content="index,follow">
<title>Discover Authors | Imperial Novel</title>
<link rel="manifest" href="/manifest-17.23.0.webmanifest">
<link rel="stylesheet" href="/style-17.23.0.css">
<link rel="stylesheet" href="/app-17.23.0.css">
<link rel="stylesheet" href="/imperial-luxury-17.23.0.css">
<link rel="stylesheet" href="/imperial-design-foundation.css">
<style>
.authorsPage{min-height:100vh;background:var(--in-page,#fff);color:var(--in-text,#0B1215)}
.authorsHeader{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px clamp(18px,5vw,64px);border-bottom:1px solid var(--in-line,#e6e8ee);background:rgba(255,255,255,.88);backdrop-filter:blur(16px)}
.authorsBrand{font-weight:800;letter-spacing:-.035em;color:var(--in-text,#0B1215);text-decoration:none}
.authorsLinks{display:flex;gap:16px;flex-wrap:wrap}.authorsLinks a{color:var(--in-muted,#52606d);font-weight:650;text-decoration:none}.authorsLinks a:hover{color:var(--in-brand,#6A0DAD)}
.authorsWrap{width:min(1120px,calc(100% - 36px));margin:0 auto;padding:clamp(38px,7vw,76px) 0 80px}
.authorsEyebrow{color:var(--in-brand,#6A0DAD);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.authorsTitle{max-width:760px;margin:12px 0;font-size:clamp(36px,7vw,64px);line-height:1.02;letter-spacing:-.055em}
.authorsIntro{max-width:660px;color:var(--in-muted,#52606d);font-size:17px;line-height:1.65}
.authorsSearch{display:flex;gap:10px;max-width:720px;margin:30px 0 12px}
.authorsSearch input{flex:1;min-width:0;min-height:48px;padding:12px 15px;border:1px solid var(--in-line,#dfe3ea);border-radius:12px;background:var(--in-surface,#fff);color:inherit;font:inherit}
.authorsSearch button{min-height:48px;padding:0 20px;border:0;border-radius:12px;background:var(--in-brand,#6A0DAD);color:#fff;font:inherit;font-weight:750;cursor:pointer}
.authorsSearch button:focus-visible,.authorsSearch input:focus-visible,.authorsLinks a:focus-visible,.authorsBrand:focus-visible{outline:3px solid #0F52BA;outline-offset:3px}
.authorsStatus{min-height:24px;margin:14px 0;color:var(--in-muted,#52606d);font-size:14px}
.authorsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-top:22px}
.authorCard{padding:22px;border:1px solid var(--in-line,#e6e8ee);border-radius:18px;background:var(--in-surface,#fff);box-shadow:0 8px 28px rgba(11,18,21,.045)}
.authorCard h2{margin:0 0 8px;font-size:20px;letter-spacing:-.025em}.authorCard h2 a{color:inherit;text-decoration:none}.authorCard h2 a:hover{color:var(--in-brand,#6A0DAD)}
.authorCard p{margin:0;color:var(--in-muted,#52606d);font-size:14px;line-height:1.55}
.authorStats{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--in-line,#edf0f4);font-size:12px;font-weight:700;color:var(--in-muted,#52606d)}
.authorsEmpty{padding:24px;border:1px dashed var(--in-line,#cbd2dc);border-radius:16px;color:var(--in-muted,#52606d)}
@media(max-width:560px){.authorsHeader{align-items:flex-start;flex-direction:column}.authorsSearch{flex-direction:column}.authorsSearch button{width:100%}}
</style>
</head>
<body class="authorsPage">
<header class="authorsHeader">
<a class="authorsBrand" href="/">IMPERIAL NOVEL</a>
<nav class="authorsLinks" aria-label="Primary navigation"><a href="/catalog">Discover stories</a><a href="/become-an-author">Become an author</a></nav>
</header>
<main class="authorsWrap">
<p class="authorsEyebrow">The people behind the pages</p>
<h1 class="authorsTitle">Discover authors.</h1>
<p class="authorsIntro">Meet creators behind published, rights-cleared stories. Explore their work, follow a new voice, and find the next world worth entering.</p>
<form class="authorsSearch" id="authorSearch" role="search">
<label class="srOnly" for="authorQuery">Search authors</label>
<input id="authorQuery" name="q" type="search" maxlength="80" placeholder="Search by author name…" autocomplete="off">
<button type="submit">Search authors</button>
</form>
<p class="authorsStatus" id="authorStatus" role="status" aria-live="polite">Loading published authors…</p>
<section class="authorsGrid" id="authorGrid" aria-label="Published authors"></section>
<noscript><p class="authorsEmpty">Enable JavaScript to search the live author directory.</p></noscript>
</main>
<script src="/authors.js" defer></script>
</body>
</html>
