name: Temporary dependency audit diagnostics
on:
  push:
    branches:
      - diagnostics/npm-audit-2026-11-23
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current locked dependencies
        run: npm ci
      - name: Test patched Tiptap dependency tree
        run: |
          npm pkg set 'overrides.@tiptap/extension-bubble-menu=3.30.5' 'overrides.@tiptap/extension-floating-menu=3.30.5'
          npm audit fix --package-lock-only --ignore-scripts
          npm ci
      - name: Capture patched audit report
        run: |
          npm audit --json > npm-audit-patched.json || status=$?
          node -e "const a=require('./npm-audit-patched.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-patched-report
          path: |
            npm-audit-patched.json
            package-lock.json
          if-no-files-found: warn
