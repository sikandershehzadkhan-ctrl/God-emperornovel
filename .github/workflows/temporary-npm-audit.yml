name: Temporary dependency audit diagnostics
on:
  push:
    branches:
      - diagnostics/npm-audit-2026-11-23
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture complete npm audit report
        run: |
          npm audit --json > npm-audit.json || status=$?
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          exit ${status:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit.json
          if-no-files-found: error
