name: Temporary dependency audit diagnostics
on:
  push:
    branches:
      - diagnostics/npm-audit-2026-11-23
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install current locked dependencies
        run: npm ci
      - name: Test coordinated Tiptap 3.35.0 upgrade
        run: |
          npm pkg set 'dependencies.@tiptap/react=3.35.0' 'dependencies.@tiptap/starter-kit=3.35.0' 'overrides.@tiptap/extension-bubble-menu=3.35.0' 'overrides.@tiptap/extension-floating-menu=3.35.0'
          npm install --package-lock-only --ignore-scripts
          npm ci
      - name: Capture audit and build results
        run: |
          npm audit --json > npm-audit-upgraded.json || audit_status=$?
          node -e "const a=require('./npm-audit-upgraded.json'); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? {}, null, 2))"
          npm run build:cloudflare
          exit ${audit_status:-0}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-upgraded-report
          path: |
            npm-audit-upgraded.json
            package-lock.json
          if-no-files-found: warn
