name: Imperial Novel Legacy ZIP Audit

on:
  push:
    branches: [main]
    paths:
      - 'Imperial-Novel-*.zip'
      - '.github/workflows/audit-legacy-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imperial-novel-zip-audit
  cancel-in-progress: true

jobs:
  inspect-legacy-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect newest versioned Imperial Novel archive
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'Imperial-Novel-*.zip' -printf '%f\n' | sort -V | tail -1)
          REPORT="$RUNNER_TEMP/imperial-novel-zip-audit.txt"
          if [ -z "$ZIP_FILE" ]; then
            echo "FAIL: no Imperial-Novel ZIP found at repository root." | tee "$REPORT"
            mkdir -p audit-report
            cp "$REPORT" audit-report/report.txt
            exit 1
          fi

          {
            echo "Imperial Novel archive audit"
            echo "Archive: $ZIP_FILE"
            echo "Commit: $GITHUB_SHA"
            echo
            echo "Archive metadata:"
            ls -lh "$ZIP_FILE"
            echo
            echo "Top-level archive entries:"
            unzip -Z1 "$ZIP_FILE" | awk -F/ 'NF {print $1}' | sort -u | head -100
            echo
            echo "Project manifests and Wrangler configs:"
            unzip -Z1 "$ZIP_FILE" | grep -E '(^|/)(package\.json|package-lock\.json|wrangler\.toml|wrangler\.json|wrangler\.jsonc)$' || true
          } | tee "$REPORT"

          mkdir -p .audit-extract
          unzip -q "$ZIP_FILE" -d .audit-extract
          {
            echo
            echo "Package versions and scripts:"
            find .audit-extract -name package.json -type f -print0 | while IFS= read -r -d '' f; do
              echo "--- $f"
              node -e 'const p=require(process.argv[1]); console.log(JSON.stringify({name:p.name,version:p.version,scripts:p.scripts,dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))' "$PWD/$f" || true
            done
            echo
            echo "Wrangler configurations:"
            find .audit-extract -type f \( -name wrangler.toml -o -name wrangler.json -o -name wrangler.jsonc \) -print0 | while IFS= read -r -d '' f; do
              echo "--- $f"
              sed -n '1,250p' "$f"
            done
            echo
            echo "Database migration file list:"
            find .audit-extract -type f \( -path '*/migrations/*' -o -path '*/migrations/d1/*' \) -print | sort | head -300
            echo
            echo "Source file inventory (first 250 paths):"
            find .audit-extract -maxdepth 5 -type f | sort | head -250
            echo
            echo "Worker/API route and security markers:"
            grep -nE 'fetch\(|/api/|/novel/|/read/|/fandom/|TODO|FIXME|EASYPaisa|payment|admin|auth|CORS|Access-Control|verify|rights' .audit-extract/src/index.js .audit-extract/public/app.js | head -250 || true
            echo
            echo "Migration SQL headers:"
            for f in $(find .audit-extract/migrations -type f -name '*.sql' | sort); do
              echo "--- $f"
              sed -n '1,35p' "$f"
            done
            echo
            echo "Build validation:"
            (cd .audit-extract && npm run build)
            echo "PASS: package build script completed."
          } | tee -a "$REPORT"

          mkdir -p audit-report
          cp "$REPORT" audit-report/report.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperial-novel-archive-audit
          path: audit-report/report.txt
          if-no-files-found: warn

      - name: Upload candidate application source for independent review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperial-novel-candidate-source
          path: |
            .audit-extract/src/**
            .audit-extract/public/**
            .audit-extract/migrations/**
            .audit-extract/package.json
            .audit-extract/package-lock.json
            .audit-extract/wrangler.toml
            .audit-extract/README.md
            .audit-extract/UPDATE-16.64.0-MANIFEST.txt
          if-no-files-found: warn
          compression-level: 6
