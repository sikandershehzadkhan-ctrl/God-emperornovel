name: Imperial Novel Cloudflare Worker Identity Audit

on:
  push:
    branches: [main]
    paths:
      - 'docs/DEPLOYMENT-IDENTITY-INVESTIGATION.md'
      - '.github/workflows/cloudflare-worker-identity-audit.yml'
  workflow_dispatch:
    inputs:
      confirm_read_only_audit:
        description: "Confirm this workflow must only inspect Worker deployment metadata and public health"
        required: true
        default: "yes"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: imperial-novel-worker-identity-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirm_read_only_audit == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Cloudflare credentials without printing secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          case "$CLOUDFLARE_ACCOUNT_ID" in *[!a-fA-F0-9]*|'') echo "::error::Account ID is not a hex identifier"; exit 1;; esac
          echo "Credentials are present. Secret values will not be printed."

      - name: Inspect Worker deployment metadata (read-only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/god-emperornovel/deployments"
          response="$(curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$url")"
          printf '%s' "$response" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const d=JSON.parse(s);
            if(!d.success){console.error("Cloudflare API returned success=false");process.exit(1)}
            const deployments=Array.isArray(d.result)?d.result:[];
            console.log("Worker deployment metadata (safe fields only):");
            for(const x of deployments.slice(0,10)){
              console.log(JSON.stringify({
                id:x.id,
                created_on:x.created_on,
                source:x.source,
                strategy:x.strategy,
                versions:Array.isArray(x.versions)?x.versions.map(v=>({version_id:v.version_id,percentage:v.percentage})):undefined
              }));
            }
            if(!deployments.length) console.log("No deployments were returned for this Worker name.");
          '

      - name: Compare public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          url="https://god-emperornovel.sikandershehzadkhan.workers.dev/api/health?identity-audit=$(date +%s%N)"
          response="$(curl --fail --silent --show-error --max-time 25 -H "Cache-Control: no-cache" "$url")"
          printf '%s' "$response" | node --input-type=module -e '
            let s=""; for await (const c of process.stdin) s+=c;
            const d=JSON.parse(s);
            console.log(JSON.stringify({ok:d.ok,service:d.service,version:d.version,database:d.database,time:d.time},null,2));
            if(d.ok!==true || d.database!==true) process.exitCode=1;
          '
          echo "This workflow is read-only: it does not deploy, edit Worker configuration, or execute D1 statements."
