name: Prepare local React dependencies

on:
  push:
    branches: [feature/react-local-islands]

permissions:
  contents: write

concurrency:
  group: prepare-react-dependencies
  cancel-in-progress: false

jobs:
  lock-dependencies:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip react bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve and lock local React build dependencies
        run: npm install --save-exact react@19 react-dom@19 && npm install --save-dev --save-exact esbuild
      - name: Commit the generated, exact dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock is already current."
            exit 0
          fi
          git commit -m "chore: lock local React island dependencies [skip react bootstrap]"
          git push
