name: Deploy Imperial Novel 16.4.0

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Imperial Novel ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'Imperial-Novel-16.4.0-Chapter-Creation-Repair.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Imperial-Novel-16.4.0-Chapter-Creation-Repair.zip not found."
            exit 1
          fi

          mkdir -p .deploy
          unzip -o "$ZIP_FILE" -d .deploy

          echo "Extracted project:"
          find .deploy -maxdepth 2 -type f | head -100

      - name: Locate Worker project
        shell: bash
        run: |
          set -e

          WRANGLER=$(find .deploy -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' | head -n 1)

          if [ -z "$WRANGLER" ]; then
            echo "ERROR: No Wrangler configuration found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRANGLER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Worker project: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare
        working-directory: ${{ env.PROJECT_DIR }}
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
