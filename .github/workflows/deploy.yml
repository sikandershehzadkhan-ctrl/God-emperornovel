name: Deploy Imperial Novel to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imperial-novel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse legacy ZIP deployment
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::Deployment blocked: application source is not present at repository root. The old workflow deployed a legacy ZIP, which is not verified. Restore the intended Imperial Novel source tree before deploying."
            exit 1
          fi
          if [ ! -f wrangler.jsonc ] && [ ! -f wrangler.toml ] && [ ! -f wrangler.json ]; then
            echo "::error::Deployment blocked: no root Wrangler configuration was found."
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::Deployment blocked: package-lock.json is required for reproducible npm ci installs."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Cloudflare readiness
        run: npm run check:cloudflare-readiness

      - name: Build for Cloudflare
        run: npm run build:cloudflare

      - name: Deploy verified source to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
