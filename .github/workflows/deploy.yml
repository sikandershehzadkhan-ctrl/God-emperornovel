name: Deploy Imperial Novel to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type true only after the read-only production D1 audit and release review have passed"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: imperial-novel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate source and production configuration
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f wrangler.toml
          test -f src/index.js
          test -f public/index.html
          test -f public/app.js
          test -d migrations
          npm run check:cloudflare-readiness
          npm ci
          npm run build
          python3 - <<'PY'
          import glob, sqlite3, sys
          db = sqlite3.connect(':memory:')
          paths = sorted(glob.glob('migrations/*.sql'))
          if not paths:
              print('::error::No SQL migrations found.')
              sys.exit(1)
          for path in paths:
              try:
                  with open(path, encoding='utf-8') as f:
                      db.executescript(f.read())
              except Exception as exc:
                  print(f'::error::Fresh-database migration check failed in {path}: {exc}')
                  sys.exit(1)
          print(f'Fresh SQLite migration check passed for {len(paths)} files.')
          PY

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Deployment blocked: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty or unavailable."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == *$'\n'* || "$CLOUDFLARE_API_TOKEN" == *$'\r'* || "$CLOUDFLARE_API_TOKEN" == *'Bearer '* || "$CLOUDFLARE_API_TOKEN" == *'Authorization:'* ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN must contain only the raw token on one line."
            exit 1
          fi
          npx --yes wrangler@4 whoami

      - name: Block deployment on unreviewed production schema drift
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Checking the live schema marker before any production deployment..."
          marker_output="$(npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "SELECT value FROM app_settings WHERE key='core_schema_version' LIMIT 1;")"
          printf '%s\n' "$marker_output"
          marker="$(printf '%s' "$marker_output" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/"value"\s*:\s*"([^"]+)"/);console.log(m?m[1]:"unknown")})')"
          echo "Live schema marker: $marker"
          if [ "$marker" != "16.64.0" ]; then
            echo "::error::Production deployment blocked: schema marker is '$marker', expected '16.64.0'. Complete and verify the schema upgrade plan before deploying. No Worker deployment was attempted."
            exit 1
          fi
          echo "Schema marker matches the currently reviewed runtime baseline."

      - name: Validate Cloudflare bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
