name: Deploy Imperial Novel to Cloudflare

on:
  push:
    branches: [main]
    # Documentation, agent profiles, and audit-workflow additions must never
    # trigger a production deployment by themselves. App/source changes still do.
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '.github/workflows/**'
      - 'scripts/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type true only after the read-only production D1 audit and release review have passed"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: imperial-novel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_production_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate source and production configuration
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f wrangler.toml
          test -f src/index.js
          test -f public/index.html
          test -f public/app.js
          test -d migrations
          npm run check:cloudflare-readiness
          npm ci
          npm run build
          python3 - <<'PY'
          import glob, sqlite3, sys
          db = sqlite3.connect(':memory:')
          paths = sorted(glob.glob('migrations/*.sql'))
          if not paths:
              print('::error::No SQL migrations found.')
              sys.exit(1)
          for path in paths:
              try:
                  with open(path, encoding='utf-8') as f:
                      db.executescript(f.read())
              except Exception as exc:
                  print(f'::error::Fresh-database migration check failed in {path}: {exc}')
                  sys.exit(1)
          print(f'Fresh SQLite migration check passed for {len(paths)} files.')
          PY

      - name: Verify Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Deployment blocked: CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is empty or unavailable."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == *$'\n'* || "$CLOUDFLARE_API_TOKEN" == *$'\r'* || "$CLOUDFLARE_API_TOKEN" == *'Bearer '* || "$CLOUDFLARE_API_TOKEN" == *'Authorization:'* ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN must contain only the raw token on one line."
            exit 1
          fi
          npx --yes wrangler@4 whoami

      - name: Verify production schema compatibility before deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Checking the live schema marker and required production structures..."
          marker_output="$(npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "SELECT value FROM app_settings WHERE key='core_schema_version' LIMIT 1;")"
          printf '%s\n' "$marker_output"
          marker="$(printf '%s' "$marker_output" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/"value"\s*:\s*"([^"]+)"/);console.log(m?m[1]:"unknown")})')"
          echo "Live schema marker: $marker"
          if [ "$marker" = "16.64.0" ]; then
            echo "Schema marker matches the reviewed runtime baseline."
          elif [ "$marker" = "16.12.1" ]; then
            echo "Legacy marker found. Checking production tables and columns before allowing the additive runtime bootstrap."
            compatibility_output="$(npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "SELECT CASE WHEN EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='users') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='novels') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='chapters') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='app_settings') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='agents') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='agent_runs') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='ai_author_projects') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='ai_chapter_jobs') AND EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='ai_generation_runs') AND EXISTS(SELECT 1 FROM pragma_table_info('novels') WHERE name='publication_status') AND EXISTS(SELECT 1 FROM pragma_table_info('novels') WHERE name='rights_evidence') AND EXISTS(SELECT 1 FROM pragma_table_info('chapters') WHERE name='publication_status') AND EXISTS(SELECT 1 FROM pragma_table_info('ai_author_projects') WHERE name='updated_at') AND EXISTS(SELECT 1 FROM pragma_table_info('ai_chapter_jobs') WHERE name='project_id') AND EXISTS(SELECT 1 FROM pragma_table_info('ai_generation_runs') WHERE name='created_at') THEN 'compatible' ELSE 'incompatible' END AS compatibility;")"
            printf '%s\n' "$compatibility_output"
            compatibility="$(printf '%s' "$compatibility_output" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/"compatibility"\s*:\s*"([^"]+)"/);console.log(m?m[1]:"unknown")})')"
            if [ "$compatibility" != "compatible" ]; then
              echo "::error::Production schema is not compatible with the additive runtime bootstrap. No Worker deployment was attempted."
              exit 1
            fi
            echo "Required legacy schema structures are present. Runtime bootstrap will apply only its reviewed idempotent schema operations and advance the marker after success."
          else
            echo "::error::Unrecognized production schema marker '$marker'. Deployment blocked pending review."
            exit 1
          fi

      - name: Validate Cloudflare bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy Worker and static assets
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live Worker health after deployment
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          base="https://god-emperornovel.sikandershehzadkhan.workers.dev"
          response=""
          verified=false
          for attempt in $(seq 1 10); do
            response="$(curl --fail --silent --show-error --max-time 20 -H "Cache-Control: no-cache" "$base/api/health?verify=$(date +%s%N)" || true)"
            if printf '%s' "$response" | EXPECTED_VERSION="$EXPECTED_VERSION" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const d=JSON.parse(s);process.exit(d.ok===true&&d.database===true&&d.version===process.env.EXPECTED_VERSION?0:1)}catch{process.exit(1)}})'; then
              verified=true
              break
            fi
            echo "Waiting for release $EXPECTED_VERSION to become healthy (attempt $attempt/10)..."
            sleep 6
          done
          printf '%s\n' "$response"
          if [ "$verified" != true ]; then
            echo "::error::Live Worker did not report healthy release $EXPECTED_VERSION."
            exit 1
          fi
          printf '%s' "$response" | EXPECTED_VERSION="$EXPECTED_VERSION" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=JSON.parse(s);if(d.ok!==true||d.database!==true||d.version!==process.env.EXPECTED_VERSION){console.error("Live Worker version/database mismatch: "+JSON.stringify({version:d.version,database:d.database}));process.exit(1)}console.log("Live Worker release "+process.env.EXPECTED_VERSION+" and database health verified.")})'

      - name: Verify live homepage and versioned frontend assets
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          base="https://god-emperornovel.sikandershehzadkhan.workers.dev"
          stamp="$(date +%s%N)"
          html=""
          homepage_verified=false
          for attempt in $(seq 1 10); do
            html="$(curl --silent --show-error --max-time 20 -H "Cache-Control: no-cache" "$base/?verify=$stamp-$attempt" || true)"
            if [ -n "$html" ] \
              && printf '%s' "$html" | grep -F "Imperial Novel" >/dev/null \
              && printf '%s' "$html" | grep -F "Read • Create • Conquer" >/dev/null \
              && printf '%s' "$html" | grep -F "/app-$EXPECTED_VERSION.js" >/dev/null \
              && printf '%s' "$html" | grep -F "/manifest-$EXPECTED_VERSION.webmanifest" >/dev/null; then
              homepage_verified=true
              echo "Live homepage references release $EXPECTED_VERSION on attempt $attempt."
              break
            fi
            echo "Waiting for the live HTML shell to converge on release $EXPECTED_VERSION (attempt $attempt/10)."
            sleep 5
          done
          if [ "$homepage_verified" != true ]; then
            echo "::error::Live homepage did not converge on release $EXPECTED_VERSION within 50 seconds."
            printf '%s\n' "$html" | grep -Eo '(src|href)="[^"]+"' | head -40 || true
            exit 1
          fi

          asset_paths="$(printf '%s' "$html" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const found=[...s.matchAll(/(?:src|href)="(\/[^\"?#]+\.(?:js|css|webmanifest|svg))"/g)].map(m=>m[1]);console.log([...new Set(found)].join("\n"))})')"
          test -n "$asset_paths" || { echo "::error::No local frontend assets found in live homepage HTML."; exit 1; }
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            status=""
            for attempt in $(seq 1 3); do
              status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$base$asset?verify=$stamp-$attempt" || true)"
              case "$status" in 2??|3??) break ;; esac
              sleep 2
            done
            case "$status" in
              2??|3??) echo "Asset reachable ($status): $asset" ;;
              *) echo "::error::Asset unavailable after retries ($status): $asset"; exit 1 ;;
            esac
          done <<< "$asset_paths"

          js="$(curl --fail --silent --show-error --max-time 20 "$base/app-$EXPECTED_VERSION.js?verify=$stamp")"
          printf '%s' "$js" | grep -F 'Open a world.' >/dev/null
          printf '%s' "$js" | grep -F 'Shape an empire.' >/dev/null
          printf '%s' "$js" | grep -F 'imperialLanguageSelect' >/dev/null
          if printf '%s' "$js" | grep -F 'heroSideCard' >/dev/null; then
            echo "::error::Legacy hero card is still in the live runtime."
            exit 1
          fi
          if printf '%s' "$js" | grep -F 'nextQuickGrid' >/dev/null; then
            echo "::error::Legacy quick-tile row is still in the live runtime."
            exit 1
          fi
          css="$(curl --fail --silent --show-error --max-time 20 "$base/imperial-luxury-$EXPECTED_VERSION.css?verify=$stamp")"
          printf '%s' "$css" | grep -F 'Final art direction: editorial authority' >/dev/null
          echo "Verified release $EXPECTED_VERSION, redesigned hero, language control, Imperial art direction, crest, manifest, and every referenced frontend asset."

