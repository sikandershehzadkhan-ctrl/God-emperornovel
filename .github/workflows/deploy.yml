name: Deploy Imperial Novel to Cloudflare

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type true only after the production build and D1 migration review have passed"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: imperial-novel-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse unverified source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::Deployment blocked: application source is not present at repository root."
            exit 1
          fi
          if [ ! -f wrangler.jsonc ] && [ ! -f wrangler.toml ] && [ ! -f wrangler.json ]; then
            echo "::error::Deployment blocked: no root Wrangler configuration was found."
            exit 1
          fi
          if [ ! -f package-lock.json ]; then
            echo "::error::Deployment blocked: package-lock.json is required for reproducible npm ci installs."
            exit 1
          fi
          if ! node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.build ? 0 : 1)"; then
            echo "::error::Deployment blocked: package.json must define a build script."
            exit 1
          fi
          if [ ! -f src/index.js ] || [ ! -d public ] || [ ! -d migrations ]; then
            echo "::error::Deployment blocked: expected Worker source, public assets, or migrations directory is missing."
            exit 1
          fi
          node --check src/index.js
          if [ -f public/app.js ]; then node --check public/app.js; fi
          python3 - <<'PY'
          import glob, sqlite3, sys
          db = sqlite3.connect(':memory:')
          for path in sorted(glob.glob('migrations/*.sql')):
              try:
                  with open(path, encoding='utf-8') as f:
                      db.executescript(f.read())
              except Exception as exc:
                  print(f'::error::D1 migration validation failed in {path}: {exc}')
                  sys.exit(1)
          print('All checked SQL migrations apply cleanly to a fresh SQLite database.')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Cloudflare readiness
        run: npm run build

      - name: Build for Cloudflare
        run: npx wrangler deploy

      - name: Deploy verified source to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
