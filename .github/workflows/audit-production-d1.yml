name: Imperial Novel Read-Only Production D1 Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-d1.yml'
  workflow_dispatch:
    inputs:
      confirm_read_only_audit:
        description: "Confirm this is a read-only production database audit"
        required: true
        default: "yes"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: imperial-novel-production-d1-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name == 'push' || inputs.confirm_read_only_audit == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'database_name = "god-emperornovel-db"' wrangler.toml
          grep -q 'database_id = "78493557-1142-45e6-96aa-2ba9f67e3be0"' wrangler.toml
          echo "Confirmed target database identity from repository configuration."

      - name: Diagnose credentials without exposing secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is empty or unavailable."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is empty or unavailable."
            exit 1
          fi
          token_length=${#CLOUDFLARE_API_TOKEN}
          echo "Cloudflare token secret is present; character count: $token_length (token value is never printed)."
          if [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::Token contains whitespace. Store only the raw API token, with no spaces, line breaks, 'Bearer ' prefix, or Authorization header."
            exit 1
          fi
          if [[ "$CLOUDFLARE_API_TOKEN" == *'Bearer '* || "$CLOUDFLARE_API_TOKEN" == *'Authorization:'* ]]; then
            echo "::error::Token must be the raw API token only, not a header."
            exit 1
          fi
          echo "Checking token validity and account access with Wrangler (post-secret-update verification)..."
          npx --yes wrangler@4 whoami

      - name: Check public production Worker health
        shell: bash
        run: |
          set -euo pipefail
          site="https://god-emperornovel.sikandershehzadkhan.workers.dev"
          echo "===== Public home response ====="
          curl --fail --silent --show-error --max-time 20 -o /dev/null -w "HTTP %{http_code}; content-type %{content_type}; total %{time_total}s\\n" "$site/"
          echo "===== Public API health response ====="
          health_json="$(curl --fail --silent --show-error --max-time 20 "$site/api/health")"
          printf '%s\\n' "$health_json"
          live_version="$(printf '%s' "$health_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version||'unknown')}catch{console.log('unknown')}})")"
          repo_version="$(sed -n 's/^[[:space:]]*APP_VERSION = "\\([^"]*\\)".*/\\1/p' wrangler.toml | head -n 1)"
          echo "Live Worker version: $live_version"
          echo "Repository target version: ${repo_version:-unknown}"
          if [ -n "$repo_version" ] && [ "$live_version" != "$repo_version" ]; then
            echo "::notice::Production version drift detected. A successful GitHub commit does not itself deploy the Worker."
          else
            echo "Live Worker version matches the repository target."
          fi
          echo

      - name: Read-only database inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          run_query() {
            local label="$1"
            local sql="$2"
            echo
            echo "===== $label (read-only) ====="
            npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "$sql"
          }
          run_query "Complete production table inventory" "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name;"
          core_tables_sql="$(cat <<'SQL'
          WITH required(name) AS (
            VALUES ('users'),('sessions'),('novels'),('chapters'),('genres'),('tags'),('novel_genres'),('novel_tags'),
                   ('unlocks'),('unlock_batches'),('bookmarks'),('history'),('donations'),('connectors'),('comments'),
                   ('novel_requests'),('audit_logs'),('ticket_ledger'),('follows'),('user_library'),('ratings'),('reports'),
                   ('notifications'),('agents'),('agent_runs'),('app_settings'),('chapter_views'),('content_rights'),('rights_audit_log'),('connector_events'),('import_jobs'),('recommendations'),('request_votes'),('comment_likes'),('comment_reports'),('connector_authorization_requests'),('taxonomy_submissions'),('taxonomy_suggestions'),('tag_follows'),('ai_author_projects'),
                   ('ai_chapter_jobs'),('ai_generation_runs'),('ai_provider_benchmarks'),('ai_publish_policies')
          )
          SELECT required.name AS required_table,
                 CASE WHEN actual.name IS NULL THEN 'MISSING' ELSE 'present' END AS status
          FROM required
          LEFT JOIN sqlite_master actual ON actual.type='table' AND actual.name=required.name
          ORDER BY required.name;
          SQL
          )"
          run_query "Core runtime table presence" "$core_tables_sql"
          migration_table_check="$(npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "SELECT CASE WHEN EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='d1_migrations') THEN 'present' ELSE 'absent' END AS migration_history_table;" 2>&1)"
          printf '%s\n' "$migration_table_check"
          if printf '%s' "$migration_table_check" | grep -q '"present"'; then
            run_query "Applied D1 migration history" "SELECT * FROM d1_migrations ORDER BY id;"
          else
            echo "No d1_migrations table exists in this production database. This is an observed schema fact, not a reason to stop the remaining read-only checks."
          fi
          run_query "Publication status counts" "SELECT COALESCE(publication_status,'<NULL>') AS publication_status, COUNT(*) AS novel_count FROM novels GROUP BY publication_status ORDER BY publication_status;"
          run_query "Chapter publication status counts" "SELECT COALESCE(publication_status,'<NULL>') AS publication_status, COUNT(*) AS chapter_count FROM chapters GROUP BY publication_status ORDER BY publication_status;"
          run_query "Safe aggregate inventory" "SELECT (SELECT COUNT(*) FROM users) AS users_total, (SELECT COUNT(*) FROM users WHERE role='admin' AND banned=0) AS active_admins, (SELECT COUNT(*) FROM novels) AS novels_total, (SELECT COUNT(*) FROM chapters) AS chapters_total, (SELECT COUNT(*) FROM donations WHERE status='pending') AS pending_donations, (SELECT COUNT(*) FROM novel_requests WHERE status='pending') AS pending_novel_requests;"
          run_query "Schema version marker" "SELECT key,value FROM app_settings WHERE key IN ('core_schema_version','first_admin_bootstrap_done') ORDER BY key;"
          run_query "User account schema (columns only)" "PRAGMA table_info(users);"
          run_query "Chapter schema (columns only)" "PRAGMA table_info(chapters);"
          run_query "Application settings schema (columns only)" "PRAGMA table_info(app_settings);"
          run_query "Publication and rights columns" "PRAGMA table_info(novels);"
          run_query "Published catalog rights readiness (aggregate only)" "SELECT COUNT(*) AS published_novels, SUM(CASE WHEN COALESCE(rights_status,'') NOT IN ('original','licensed','authorized','public_domain','cc') THEN 1 ELSE 0 END) AS unusual_rights_status, SUM(CASE WHEN COALESCE(rights_evidence,'')='' THEN 1 ELSE 0 END) AS missing_rights_evidence, SUM(CASE WHEN owner_user_id IS NULL THEN 1 ELSE 0 END) AS missing_owner FROM novels WHERE publication_status='published';"
          run_query "Published chapter integrity (aggregate only)" "SELECT COUNT(*) AS published_chapters, SUM(CASE WHEN n.id IS NULL THEN 1 ELSE 0 END) AS chapters_without_novel FROM chapters c LEFT JOIN novels n ON n.id=c.novel_id WHERE COALESCE(c.publication_status,'published')='published';"
          echo
          echo "Audit completed with SELECT/PRAGMA statements only. No data was changed and no deployment was performed."
