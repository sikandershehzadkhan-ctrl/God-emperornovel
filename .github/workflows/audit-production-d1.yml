name: Imperial Novel Read-Only Production D1 Audit

on:
  workflow_dispatch:
    inputs:
      confirm_read_only_audit:
        description: "Confirm this is a read-only production database audit"
        required: true
        default: "yes"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: read

concurrency:
  group: imperial-novel-production-d1-audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ inputs.confirm_read_only_audit == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Wrangler configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'database_name = "god-emperornovel-db"' wrangler.toml
          grep -q 'database_id = "78493557-1142-45e6-96aa-2ba9f67e3be0"' wrangler.toml
          echo "Confirmed target database identity from repository configuration."

      - name: Read-only database inventory
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare GitHub Actions secrets are not configured. No database query was run."
            exit 1
          fi
          run_query() {
            local label="$1"
            local sql="$2"
            echo
            echo "===== $label (read-only) ====="
            npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "$sql"
          }
          run_query "Migration history table presence" "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('d1_migrations','app_settings','users','novels','chapters','donations','ticket_ledger','content_rights') ORDER BY name;"
          run_query "Publication status counts" "SELECT COALESCE(publication_status,'<NULL>') AS publication_status, COUNT(*) AS novel_count FROM novels GROUP BY publication_status ORDER BY publication_status;"
          run_query "Chapter publication status counts" "SELECT COALESCE(publication_status,'<NULL>') AS publication_status, COUNT(*) AS chapter_count FROM chapters GROUP BY publication_status ORDER BY publication_status;"
          run_query "Safe aggregate inventory" "SELECT (SELECT COUNT(*) FROM users) AS users_total, (SELECT COUNT(*) FROM users WHERE role='admin' AND banned=0) AS active_admins, (SELECT COUNT(*) FROM novels) AS novels_total, (SELECT COUNT(*) FROM chapters) AS chapters_total, (SELECT COUNT(*) FROM donations WHERE status='pending') AS pending_donations, (SELECT COUNT(*) FROM novel_requests WHERE status='pending') AS pending_novel_requests;"
          run_query "Schema version marker" "SELECT key,value FROM app_settings WHERE key IN ('core_schema_version','first_admin_bootstrap_done') ORDER BY key;"
          run_query "Publication and rights columns" "PRAGMA table_info(novels);"
          echo
          echo "Audit completed with SELECT/PRAGMA statements only. No data was changed and no deployment was performed."
