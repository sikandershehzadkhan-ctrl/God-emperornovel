name: Imperial Novel Cloudflare Source Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/validate-cloudflare-source.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imperial-novel-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Cloudflare Worker source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f wrangler.toml
          test -f src/index.js
          test -f public/index.html
          test -f public/app.js
          test -d migrations
          node -e "const p=require('./package.json'); if(!p.scripts?.build) process.exit(1)"
          echo "Required Worker source, assets, migrations, and build script are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/app.js

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Test Crown ledger atomicity against SQLite
        run: python3 scripts/test-crown-ledger.py

      - name: Check production safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('src/index.js').read_text(encoding='utf-8')
          audit = Path('.github/workflows/audit-production-d1.yml').read_text(encoding='utf-8')
          runtime_tables = set(re.findall(r'CREATE TABLE IF NOT EXISTS\s+([A-Za-z_][A-Za-z0-9_]*)', source))
          audited_tables = set(re.findall(r"\('([a-z_]+)'\)", audit))
          missing_audit_tables = sorted(runtime_tables - audited_tables)
          checks = {
              'read-only audit inventory covers every literal runtime table': not missing_audit_tables,
              'public agent status does not expose internal run results': 'SELECT slug,name,role,icon,mode,status,last_run_at FROM agents WHERE enabled=1' in source and 'SELECT slug,name,role,icon,mode,status,last_run_at,last_result FROM agents WHERE enabled=1' not in source,
              'public OmniPortal status only exposes authorized enabled connector metadata': "WHERE enabled=1 AND rights_status='authorized'" in source and 'SELECT id,name,base_url,type,enabled,rights_status,last_status,last_checked_at FROM connectors ORDER BY name' not in source,
              'legacy novels remain published when the publication column is added': "['publication_status',\"TEXT NOT NULL DEFAULT 'published'\"]" in source,
              'first-admin bootstrap cannot promote an arbitrary user': "UPDATE users SET role='admin',verified=1 WHERE id=?" not in source,
              'the schema marker remains compatible with the existing runtime migration': "core_schema_version','16.64.0" in source,
              'production deployment workflow includes a schema compatibility gate': "Verify production schema compatibility before deployment" in Path('.github/workflows/deploy.yml').read_text(encoding='utf-8'),
              'production deployment gate blocks unknown markers and checks legacy schema compatibility': 'Unrecognized production schema marker' in Path('.github/workflows/deploy.yml').read_text(encoding='utf-8') and 'compatibility"' in Path('.github/workflows/deploy.yml').read_text(encoding='utf-8'),
              'novel-request refunds are conditional and idempotent': "UPDATE novel_requests SET status=? WHERE id=? AND status='pending'" in source and "INSERT INTO ticket_ledger(user_id,delta,reason,reference) SELECT ?,?,?,? WHERE changes()=1" in source,
              'payment credits are derived from the server-side donation amount': 'const crowns=Number(d.amount)' in source and 'Number(b.tickets||0)' not in source,
              'manual administrator Crown credits are positive and bounded': 'amount<1||amount>1000000' in source,
              'paid novel-request charges require a successful server-side debit': 'tickets>=?' in source and 'INSERT INTO novel_requests(user_id,url,source_host,week_key,cost,status) SELECT ?,?,?,?,?, \'pending\' WHERE changes()=1' in source,
              'single chapter unlock gates grant and ledger writes on successful debit': 'SELECT ?,?,? WHERE changes()=1' in Path('src/crown-ledger.mjs').read_text(encoding='utf-8') and 'tickets>=? AND NOT EXISTS' in Path('src/crown-ledger.mjs').read_text(encoding='utf-8'),
              'single and batch chapter purchases reject fractional Crown prices': 'Number.isSafeInteger(cost)' in source and 'Number.isSafeInteger(price)' in source,
              'shared Crown transaction helper rejects fractional amounts': 'Number.isSafeInteger(amount)' in Path('src/crown-ledger.mjs').read_text(encoding='utf-8'),
              'author chapter creation and edits reject fractional or oversized Crown prices': "!Number.isSafeInteger(cost)||cost<0||cost>1000000" in source,
              'admin chapter creation rejects fractional or oversized Crown prices': "!Number.isSafeInteger(cost)||cost<0||cost>1000000" in source and "Math.max(0,Number(b.ticket_cost??1))" not in source,
              'batch unlock debit is conditional and prevents overlapping purchases': 'tickets>=? AND NOT EXISTS (SELECT 1 FROM unlocks' in source and 'WHERE changes()=1' in source,
              'admin and author studio HTML pages use explicit role policy': 'protectedPageAccess' in source and './page-access.mjs' in source,
              'direct admin and author HTML assets are routed through the Worker': '"/admin.html"' in Path('wrangler.toml').read_text(encoding='utf-8') and '"/author.html"' in Path('wrangler.toml').read_text(encoding='utf-8'),
          }
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Validate D1 migrations against SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sqlite3, sys
          db = sqlite3.connect(':memory:')
          paths = sorted(glob.glob('migrations/*.sql'))
          if not paths:
              print('::error::No SQL migrations found.')
              sys.exit(1)
          for path in paths:
              try:
                  with open(path, encoding='utf-8') as f:
                      db.executescript(f.read())
                  print(f'PASS {path}')
              except Exception as exc:
                  print(f'::error::Migration failed: {path}: {exc}')
                  sys.exit(1)
          print(f'PASS: {len(paths)} migrations applied to fresh SQLite.')
          PY

      - name: Confirm validation only
        run: echo "Validation passed. This workflow does not deploy or modify production D1.";
