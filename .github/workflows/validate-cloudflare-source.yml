name: Imperial Novel Cloudflare Source Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/validate-cloudflare-source.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imperial-novel-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require Cloudflare Worker source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f wrangler.toml
          test -f src/index.js
          test -f public/index.html
          test -f public/app.js
          test -d migrations
          node -e "const p=require('./package.json'); if(!p.scripts?.build) process.exit(1)"
          echo "Required Worker source, assets, migrations, and build script are present."

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Worker and browser JavaScript syntax
        run: |
          node --check src/index.js
          node --check public/app.js

      - name: Build application
        run: npm run build

      - name: Validate Cloudflare Worker bundle without deploying
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Check production safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('src/index.js').read_text(encoding='utf-8')
          audit = Path('.github/workflows/audit-production-d1.yml').read_text(encoding='utf-8')
          runtime_tables = set(re.findall(r'CREATE TABLE IF NOT EXISTS\s+([A-Za-z_][A-Za-z0-9_]*)', source))
          audited_tables = set(re.findall(r"\('([a-z_]+)'\)", audit))
          missing_audit_tables = sorted(runtime_tables - audited_tables)
          checks = {
              'read-only audit inventory covers every literal runtime table': not missing_audit_tables,
              'legacy novels remain published when the publication column is added': "['publication_status',\"TEXT NOT NULL DEFAULT 'published'\"]" in source,
              'first-admin bootstrap cannot promote an arbitrary user': "UPDATE users SET role='admin',verified=1 WHERE id=?" not in source,
              'the schema marker remains compatible with the existing runtime migration': "core_schema_version','16.64.0" in source,
              'production deployment workflow includes a schema compatibility gate': "Verify production schema compatibility before deployment" in Path('.github/workflows/deploy.yml').read_text(encoding='utf-8'),
              'production deployment gate blocks unknown markers and checks legacy schema compatibility': 'Unrecognized production schema marker' in Path('.github/workflows/deploy.yml').read_text(encoding='utf-8') and 'compatibility"' in Path('.github/workflows/deploy.yml').read_text(encoding='utf-8'),
              'novel-request refunds are conditional and idempotent': "UPDATE novel_requests SET status=? WHERE id=? AND status='pending'" in source and "INSERT INTO ticket_ledger(user_id,delta,reason,reference) SELECT ?,?,?,? WHERE changes()=1" in source,
          }
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit(1)
          PY

      - name: Validate D1 migrations against SQLite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sqlite3, sys
          db = sqlite3.connect(':memory:')
          paths = sorted(glob.glob('migrations/*.sql'))
          if not paths:
              print('::error::No SQL migrations found.')
              sys.exit(1)
          for path in paths:
              try:
                  with open(path, encoding='utf-8') as f:
                      db.executescript(f.read())
                  print(f'PASS {path}')
              except Exception as exc:
                  print(f'::error::Migration failed: {path}: {exc}')
                  sys.exit(1)
          print(f'PASS: {len(paths)} migrations applied to fresh SQLite.')
          PY

      - name: Test media asset registry constraints
        run: python3 scripts/test-media-asset-registry.py

      - name: Test media storage quotas
        run: python3 scripts/test-media-storage-quotas.py

      - name: Test media publication and rights lifecycle gates
        run: python3 scripts/test-media-publication-gates.py

      - name: Test comic media owner isolation
        run: python3 scripts/test-media-owner-guards.py

      - name: Test comic page authoring database guards
        run: python3 scripts/test-comic-page-authoring.py

      - name: Test comic page authoring API boundaries
        run: python3 scripts/test-comic-page-authoring-api.py

      - name: Test Author Studio comic page manager interface
        run: python3 scripts/test-comic-page-manager-ui.py

      - name: Test private comic reader rendering
        run: python3 scripts/test-comic-reader-rendering.py

      - name: Test media upload byte and metadata policy
        run: node scripts/test-media-upload-policy.mjs

      - name: Test private media API security boundaries
        run: python3 scripts/test-media-api-security.py

      - name: Test administrator media review interface
        run: python3 scripts/test-admin-media-review-ui.py

      - name: Test creator media library interface
        run: python3 scripts/test-author-media-library-ui.py

      - name: Test catalog query aggregation parity
        run: python3 scripts/test-catalog-query.py

      - name: Test author application database constraints
        run: python scripts/test-author-applications.py

      - name: Test normalized donation reference uniqueness
        run: python3 scripts/test-donation-reference-unique.py

      - name: Test atomic novel request charging
        run: python3 scripts/test-novel-request-charge-atomic.py

      - name: Confirm validation only
        run: echo "Validation passed. This workflow does not deploy or modify production D1.";
