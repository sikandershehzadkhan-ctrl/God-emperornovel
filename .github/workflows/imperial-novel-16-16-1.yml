name: Imperial Novel 16.16.1

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract 16.16.1
        run: |
          unzip -o Imperial-Novel-16.16.1-Rights-OmniPortal-Security.zip

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify
        run: |
          echo "Imperial Novel 16.16.1 build completed successfully."
