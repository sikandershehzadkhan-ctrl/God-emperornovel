name: Imperial Novel Architecture Governance
on:
  pull_request:
    branches: [main, "integration/**"]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  architecture-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enforce linear integration of shared surfaces
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/test-pr-shared-surface-lineage.mjs
      - name: Validate ownership, dependencies, migrations and PR paths
        env:
          ARCH_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/architecture/test-governance.mjs
