name: Imperial Novel Post-Deploy Verification

on:
  workflow_run:
    workflows: ["Deploy Imperial Novel to Cloudflare"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: imperial-novel-post-deploy-verification
  cancel-in-progress: false

jobs:
  verify-live:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the exact source revision that was deployed
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve expected release from the checked-out source
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f public/index.html
          VERSION="$(node -p "require('./package.json').version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Verifying source release $VERSION."

      - name: Verify live Worker health and release version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://god-emperornovel.sikandershehzadkhan.workers.dev"
          stamp="$(date +%s)"
          verified=false
          response=""
          for attempt in $(seq 1 24); do
            response="$(curl --fail --silent --show-error --max-time 15 "$base/api/health?verify=$stamp-$attempt" 2>/dev/null || true)"
            if printf '%s' "$response" | EXPECTED_VERSION="$EXPECTED_VERSION" node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const h=JSON.parse(s);process.exit(h.ok===true&&h.database===true&&h.version===process.env.EXPECTED_VERSION?0:1)}catch{process.exit(1)}})' 2>/dev/null; then
              printf '%s\n' "$response"
              echo "Live Worker health and release $EXPECTED_VERSION verified on attempt $attempt."
              verified=true
              break
            fi
            echo "Waiting for healthy release $EXPECTED_VERSION (attempt $attempt/24)."
            sleep 5
          done
          if [ "$verified" != true ]; then
            echo "::error::The Worker did not serve healthy release $EXPECTED_VERSION within 120 seconds."
            printf '%s\n' "$response"
            exit 1
          fi

      - name: Verify live homepage and every referenced frontend asset
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://god-emperornovel.sikandershehzadkhan.workers.dev"
          stamp="$(date +%s)"
          html=""
          homepage_verified=false
          for attempt in $(seq 1 12); do
            html="$(curl --silent --show-error --max-time 20 -H "Cache-Control: no-cache" "$base/?verify=$stamp-$attempt" || true)"
            if [ -n "$html" ] \
              && printf '%s' "$html" | grep -F "/app-$EXPECTED_VERSION.js" >/dev/null \
              && printf '%s' "$html" | grep -F "/manifest-$EXPECTED_VERSION.webmanifest" >/dev/null; then
              homepage_verified=true
              echo "Live homepage release $EXPECTED_VERSION verified on attempt $attempt."
              break
            fi
            echo "Waiting for homepage assets to converge on $EXPECTED_VERSION (attempt $attempt/12)."
            sleep 5
          done
          if [ "$homepage_verified" != true ]; then
            echo "::error::Live homepage did not converge on release $EXPECTED_VERSION within 60 seconds."
            printf '%s\n' "$html" | grep -Eo '(src|href)="[^"]+"' | head -40 || true
            exit 1
          fi

          asset_paths="$(printf '%s' "$html" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const found=[...s.matchAll(/(?:src|href)="(\/[^\"?#]+\.(?:js|css|webmanifest|svg))"/g)].map(m=>m[1]);console.log([...new Set(found)].join("\n"))})')"
          test -n "$asset_paths" || { echo "::error::No local frontend assets were found in the homepage HTML."; exit 1; }
          while IFS= read -r asset; do
            [ -n "$asset" ] || continue
            status=""
            for attempt in $(seq 1 3); do
              status="$(curl --silent --show-error --max-time 15 -o /dev/null -w '%{http_code}' "$base$asset?verify=$stamp-$attempt" || true)"
              case "$status" in 2??|3??) break ;; esac
              sleep 2
            done
            case "$status" in
              2??|3??) echo "Asset reachable ($status): $asset" ;;
              *) echo "::error::Asset unavailable after retries ($status): $asset"; exit 1 ;;
            esac
          done <<< "$asset_paths"

          js="$(curl --fail --silent --show-error --max-time 20 "$base/app-$EXPECTED_VERSION.js?verify=$stamp")"
          printf '%s' "$js" | grep -F 'Open a world.' >/dev/null
          printf '%s' "$js" | grep -F 'Shape an empire.' >/dev/null
          printf '%s' "$js" | grep -F 'imperialLanguageSelect' >/dev/null
          if printf '%s' "$js" | grep -F 'heroSideCard' >/dev/null; then
            echo "::error::Legacy hero card markup is still present in the deployed JavaScript."
            exit 1
          fi
          if printf '%s' "$js" | grep -F 'nextQuickGrid' >/dev/null; then
            echo "::error::Legacy quick-tile row is still present in the deployed JavaScript."
            exit 1
          fi
          echo "Homepage release, branded hero, language control, and referenced assets verified."

      - name: Smoke-test application route shells
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          base="https://god-emperornovel.sikandershehzadkhan.workers.dev"
          stamp="$(date +%s)"
          for route in /catalog /formats /community /trend-factory /author /admin /read/1/1 /privacy /terms /copyright /community-taxonomy; do
            page=""
            route_verified=false
            for attempt in $(seq 1 6); do
              page="$(curl --silent --show-error --max-time 20 -H "Cache-Control: no-cache" "$base$route?verify=$stamp-$attempt" || true)"
              if [ -n "$page" ] \
                && printf '%s' "$page" | grep -F "/manifest-$EXPECTED_VERSION.webmanifest" >/dev/null; then
                case "$route" in
                  /admin)
                    printf '%s' "$page" | grep -F "/app-$EXPECTED_VERSION.css" >/dev/null \
                      && printf '%s' "$page" | grep -F "/imperial-luxury-$EXPECTED_VERSION.css" >/dev/null || continue
                    ;;
                  /privacy|/terms|/copyright)
                    printf '%s' "$page" | grep -F "/style-$EXPECTED_VERSION.css" >/dev/null \
                      && printf '%s' "$page" | grep -F "/imperial-luxury-$EXPECTED_VERSION.css" >/dev/null || continue
                    ;;
                  *)
                    printf '%s' "$page" | grep -F "/app-$EXPECTED_VERSION.js" >/dev/null || continue
                    ;;
                esac
                route_verified=true
                break
              fi
              sleep 3
            done
            if [ "$route_verified" != true ]; then
              echo "::error::Release assets not verified on route $route."
              printf '%s\n' "$page" | grep -Eo '(src|href)="[^"]+"' | head -20 || true
              exit 1
            fi
            echo "Route shell verified: $route"
          done

      - name: Verify production schema marker after first live request
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cannot verify production schema marker because Cloudflare credentials are unavailable."
            exit 1
          fi
          result="$(npx --yes wrangler@4 d1 execute god-emperornovel-db --remote --command "SELECT key,value FROM app_settings WHERE key='core_schema_version' LIMIT 1;")"
          printf '%s\n' "$result"
          marker="$(printf '%s' "$result" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=s.match(/"value"\s*:\s*"([^"]+)"/);console.log(m?m[1]:"unknown")})')"
          if [ "$marker" != "16.64.0" ]; then
            echo "::error::Live Worker schema marker is '$marker', expected reviewed baseline 16.64.0. Further investigation required."
            exit 1
          fi
          echo "Production schema marker verified at 16.64.0."
