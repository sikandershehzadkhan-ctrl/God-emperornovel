name: Imperial Novel Migration Governance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: imperial-novel-migration-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migration-governance:
    name: Migration immutability, ownership and concurrent allocation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test migration guard fixtures
        run: node scripts/test-governance-migrations.mjs --self-test

      - name: Test ownership guard fixtures
        run: node scripts/test-governance-ownership.mjs --self-test

      - name: Test concurrent migration allocation fixtures
        run: node scripts/test-governance-migration-collisions.mjs --self-test

      - name: Enforce complete path ownership and ADR requirements
        if: github.event_name == 'pull_request'
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-governance-ownership.mjs

      - name: Enforce immutable history and unique forward allocations
        if: github.event_name == 'pull_request'
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/test-governance-migrations.mjs

      - name: Reject concurrent migration sequence collisions
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/test-governance-migration-collisions.mjs
